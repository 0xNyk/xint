name: Guardrails Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Audit xint guardrails drift
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: 0xNyk
          REPOS: xint
          BRANCH: main
        run: ./scripts/audit-guardrails.sh
